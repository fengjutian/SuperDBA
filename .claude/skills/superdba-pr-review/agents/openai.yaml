interface:
  display_name: "SuperDBA PR Review"
  short_description: "Review a SuperDBA PR locally against repo rules with real test data."
  default_prompt: "Use $superdba-pr-review to review PR #N: check the diff against .rules/, verify the PR's claims, run its tests on the PR branch, and prepare real test data plus a manual test plan."

policy:
  allow_implicit_invocation: true
