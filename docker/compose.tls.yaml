# Public HTTPS deployment: Caddy terminates TLS (automatic Let's Encrypt
# certificates) and is the only service that publishes ports.
#
#   SUPERDBA_DOMAIN=superdba.example.com in .env, DNS pointing at this host
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
services:
  superdba:
    ports: !reset []
    environment:
      SUPERDBA_PUBLIC_URL: https://${SUPERDBA_DOMAIN:?set SUPERDBA_DOMAIN in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - superdba
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SUPERDBA_DOMAIN: ${SUPERDBA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
