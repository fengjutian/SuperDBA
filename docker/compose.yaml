# SuperDBA Web on this machine: http://localhost:8080
#
#   cp .env.example .env    # optional: set a password and a secret key
#   docker compose up -d
#   docker compose logs superdba   # shows the generated password on first start
#
# For a public HTTPS deployment add the Caddy override:
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
name: superdba

services:
  superdba:
    image: ghcr.io/superdba/superdba:${SUPERDBA_TAG:-latest}
    restart: unless-stopped
    ports:
      # Loopback only: the plain-HTTP URL below is accepted for localhost alone.
      - '127.0.0.1:${SUPERDBA_HTTP_PORT:-8080}:8080'
    environment:
      SUPERDBA_PUBLIC_URL: ${SUPERDBA_PUBLIC_URL:-http://localhost:${SUPERDBA_HTTP_PORT:-8080}}
      SUPERDBA_WEB_PASSWORD: ${SUPERDBA_WEB_PASSWORD:-}
      SUPERDBA_SECRET_KEY: ${SUPERDBA_SECRET_KEY:-}
      SUPERDBA_ALLOW_HIGH_RISK: ${SUPERDBA_ALLOW_HIGH_RISK:-false}
    volumes:
      - superdba-data:/data

volumes:
  superdba-data:
