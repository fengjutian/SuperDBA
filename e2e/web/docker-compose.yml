name: superdba-web-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superdba-e2e
      POSTGRES_DB: superdba_e2e
    ports:
      - '45432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d superdba_e2e']
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: superdba-e2e
      MYSQL_DATABASE: superdba_e2e
    ports:
      - '43306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-psuperdba-e2e']
      interval: 2s
      timeout: 3s
      retries: 45
